name: FTP Diagnose

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List FTP directory tree
        run: |
          sudo apt-get -yq install lftp >/dev/null 2>&1
          lftp -u "${{ secrets.HOSTINGER_FTP_USERNAME }},${{ secrets.HOSTINGER_FTP_PASSWORD }}" "ftp://${{ secrets.HOSTINGER_FTP_SERVER }}" -e "set ssl:verify-certificate no; set net:timeout 20; set net:max-retries 2; pwd; echo ===ROOT===; cls -la; echo ===PUBLIC_HTML===; cls -la public_html/; echo ===AIRPORT===; cls -la public_html/airport/; echo ===DOMAINS===; cls -la domains/; echo ===DOMAINS_SITE===; cls -la domains/mukeshart.in/; quit" || true
