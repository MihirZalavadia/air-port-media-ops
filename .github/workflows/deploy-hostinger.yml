name: Deploy Website To Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raamxmukeshart-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: raamxmukeshart-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      # rsync over SSH to the website's ABSOLUTE docroot. The main FTP
      # account is chrooted to /home/u366143613/public_html (a sibling of
      # the real webroot), which is why FTP deploys could never land —
      # SSH sees the full filesystem. --delete keeps the webroot exactly
      # in sync with the build (stale hashed _next folders get removed).
      - name: Deploy via rsync over SSH
        env:
          SSHPASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          sudo apt-get -yq install sshpass >/dev/null 2>&1
          # Hostinger SSH drops connections intermittently; rsync is
          # idempotent so retry up to 4 times before failing the deploy.
          for attempt in 1 2 3 4; do
            if sshpass -e rsync -az --delete --timeout=60 \
              -e "ssh -p 65002 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20" \
              out/ u366143613@82.25.125.220:/home/u366143613/domains/mukeshart.in/public_html/; then
              echo "Deployed to real webroot (attempt $attempt)."
              exit 0
            fi
            echo "rsync attempt $attempt failed — retrying in 30s..."
            sleep 30
          done
          echo "All rsync attempts failed."
          exit 1

      # Admin console secrets (password hash + GitHub content token) live
      # OUTSIDE the webroot, regenerated on every deploy from repo secrets.
      # Without both secrets set, the admin plays dead (404).
      - name: Provision admin config (outside webroot)
        env:
          SSHPASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          GH_CONTENT_TOKEN: ${{ secrets.GH_CONTENT_TOKEN }}
        run: |
          if [ -z "$ADMIN_PASSWORD_HASH" ] || [ -z "$GH_CONTENT_TOKEN" ]; then
            echo "Admin secrets not set — skipping admin config provisioning."
            exit 0
          fi
          printf "<?php\nreturn [\n    'password_hash' => '%s',\n    'github_token' => '%s',\n    'github_repo' => 'MihirZalavadia/air-port-media-ops',\n    'github_branch' => 'main',\n];\n" \
            "$ADMIN_PASSWORD_HASH" "$GH_CONTENT_TOKEN" | \
          sshpass -e ssh -p 65002 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            u366143613@82.25.125.220 \
            "cat > /home/u366143613/domains/mukeshart.in/admin_config.php && chmod 600 /home/u366143613/domains/mukeshart.in/admin_config.php"
          echo "Admin config provisioned."

      # Lead → Google Sheet forwarding config (outside webroot). Optional:
      # without the secret, lead.php simply skips the Sheet step.
      - name: Provision lead config (outside webroot)
        env:
          SSHPASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
        run: |
          if [ -z "$SHEETS_WEBHOOK_URL" ]; then
            echo "SHEETS_WEBHOOK_URL not set — skipping lead config provisioning."
            exit 0
          fi
          printf "<?php\nreturn [\n    'sheets_webhook_url' => '%s',\n    'sheets_token' => '%s',\n];\n" \
            "$SHEETS_WEBHOOK_URL" "$SHEETS_TOKEN" | \
          sshpass -e ssh -p 65002 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            u366143613@82.25.125.220 \
            "cat > /home/u366143613/domains/mukeshart.in/lead_config.php && chmod 600 /home/u366143613/domains/mukeshart.in/lead_config.php"
          echo "Lead config provisioned."
