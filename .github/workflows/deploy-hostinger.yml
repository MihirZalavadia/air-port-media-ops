name: Deploy Website To Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raamxmukeshart-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: raamxmukeshart-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      # rsync over SSH to the website's ABSOLUTE docroot. The main FTP
      # account is chrooted to /home/u366143613/public_html (a sibling of
      # the real webroot), which is why FTP deploys could never land —
      # SSH sees the full filesystem. --delete keeps the webroot exactly
      # in sync with the build (stale hashed _next folders get removed).
      - name: Deploy via rsync over SSH
        env:
          SSHPASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          sudo apt-get -yq install sshpass >/dev/null 2>&1
          sshpass -e rsync -az --delete \
            -e "ssh -p 65002 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            out/ u366143613@82.25.125.220:/home/u366143613/domains/mukeshart.in/public_html/
          echo "Deployed to real webroot."
