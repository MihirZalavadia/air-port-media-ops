name: Deploy Website To Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raamxmukeshart-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: raamxmukeshart-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      # Syncs only changed files after the first full upload (keeps a state
      # file on the server). Secrets are set in GitHub → Settings → Secrets.
      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: raamxmukeshart-main/out/
          # srv679: main FTP account lands at the account home; the website
          # root is domains/<domain>/public_html (File Manager is scoped
          # inside domains/mukeshart.in/, which is why it shows public_html
          # at its top level).
          server-dir: domains/mukeshart.in/public_html/
          log-level: standard
          # ONE-TIME: wipe the webroot and upload fresh — the manual upload
          # left stale hashed _next folders the differ can't reconcile.
          # REMOVE this line after the first green run.
          dangerous-clean-slate: true
