<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--ink); padding: 30px; }
  .lbl { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
  .blk { margin-bottom: 32px; }
  .ink { background: var(--ink); padding: 24px; }
  h3 { font-family: var(--font-display); font-weight: 500; font-size: 24px; margin: 14px 0 8px; }
  p.body { color: var(--ink-2); font-size: 14px; line-height: 1.6; margin: 0; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Eyebrow, Badge, Card, StatStrip, InventoryCard } = window.RajkotAirportMukeshArtsDesignSystem_f86af9;
    function Demo() {
      return (
        <div>
          <div className="blk">
            <p className="lbl">Eyebrow</p>
            <div style={{display:"flex",gap:32}}>
              <Eyebrow>Inventory · Portfolio</Eyebrow>
              <Eyebrow tone="blue">Why this format</Eyebrow>
            </div>
          </div>

          <div className="blk">
            <p className="lbl">Badge</p>
            <div className="ink" style={{display:"flex",gap:14}}>
              <Badge>PKG-01 · Digital Packages</Badge>
              <Badge variant="outline" style={{background:"#fff"}}>Awaiting confirmation</Badge>
            </div>
          </div>

          <div className="blk">
            <p className="lbl">Card</p>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
              <Card>
                <Eyebrow>01</Eyebrow>
                <h3>Premium context</h3>
                <p className="body">Airport movement gives brands a cleaner environment and an audience already attentive, not scrolling.</p>
              </Card>
              <Card>
                <Eyebrow tone="blue">02</Eyebrow>
                <h3>Right buyer fit</h3>
                <p className="body">We qualify campaigns by window, format and budget, so every package shown can be defended internally.</p>
              </Card>
            </div>
          </div>

          <div className="blk">
            <p className="lbl">StatStrip</p>
            <StatStrip stats={[
              {value:"1.25–1.30L",label:"Passenger / month"},
              {value:"4,200+",label:"Passenger / day"},
              {value:"28",label:"Daily flights"},
              {value:"₹2L+",label:"Starting range"},
            ]} />
          </div>

          <div className="blk">
            <p className="lbl">InventoryCard</p>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:22}}>
              <InventoryCard code="PKG-01" category="Digital Packages" units="18 units"
                title="Arrival + SHA Digital Loop"
                summary="Broad digital coverage across arrival and waiting zones where passengers slow down."
                format="8 ft x 3 ft LED loop" location="Arrival belts & SHA gates"
                image="../../assets/img/pkg-01.png" />
              <InventoryCard code="AD-3" category="Static Boards" units="1 board"
                title="Departure Entry Front-Lit Board"
                summary="Departure-side static inventory for road-facing airport visibility."
                format="30 ft x 10 ft front-lit" location="City-side departure entry"
                image="../../assets/img/ad-3.png" />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
  </script>

</html>
