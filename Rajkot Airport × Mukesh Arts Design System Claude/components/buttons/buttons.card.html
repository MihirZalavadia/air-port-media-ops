<!-- @dsCard group="Components" viewport="700x420" name="Buttons & Controls" subtitle="Button (primary/ghost/link), Chip, SegmentedControl" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--ink); padding: 30px; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 26px; }
  .lbl { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  .photo { background: linear-gradient(rgba(8,7,5,0.5), rgba(8,7,5,0.7)), url(../../assets/img/hero-day.png); background-size: cover; padding: 22px; margin-bottom: 26px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Button, Chip, SegmentedControl } = window.RajkotAirportMukeshArtsDesignSystem_f86af9;
    const Arrow = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>;
    function Demo() {
      const [cat, setCat] = React.useState("Digital Packages");
      const [chip, setChip] = React.useState("All");
      return (
        <div>
          <p className="lbl">Button — variants & sizes</p>
          <div className="row">
            <Button variant="primary">Request Media Kit</Button>
            <Button variant="ghost">View Inventory</Button>
            <Button variant="link" icon={<Arrow/>}>Compare routes</Button>
            <Button variant="primary" size="sm">Small</Button>
            <Button variant="primary" disabled>Disabled</Button>
          </div>
          <p className="lbl">Button — onPhoto</p>
          <div className="photo">
            <div className="row" style={{margin:0}}>
              <Button variant="primary" onPhoto>Request Media Kit</Button>
              <Button variant="ghost" onPhoto>View Inventory</Button>
            </div>
          </div>
          <p className="lbl">SegmentedControl — inventory categories</p>
          <div className="row">
            <SegmentedControl
              options={["All","Digital Packages","Static Boards","Passenger Journey","Custom Plans"]}
              value={cat} onChange={setCat} />
          </div>
          <p className="lbl">Chip — loose filters</p>
          <div className="row" style={{margin:0}}>
            {["All","Digital","Static","Backlit"].map(c => (
              <Chip key={c} active={chip===c} onClick={()=>setChip(c)}>{c}</Chip>
            ))}
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
  </script>
</body>
</html>
