<!-- @dsCard group="Type" viewport="700x200" name="Stat Numbers" subtitle="Big serif figures with mono caption — the airport stat strip." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--ink); color: #FFFAF0; padding: 26px 28px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid rgba(255,250,240,0.22); padding-top: 20px; }
  .stats article { padding-right: 22px; border-right: 1px solid rgba(255,250,240,0.14); }
  .stats article:last-child { border-right: 0; }
  .stats strong { display: block; font-family: var(--font-display); font-weight: 500; font-size: 38px; line-height: 1; }
  .stats span { display: block; margin-top: 8px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,250,240,0.7); }
</style>
</head>
<body>
  <div class="stats">
    <article><strong>1.25–1.30L</strong><span>Passenger / month</span></article>
    <article><strong>4,200+</strong><span>Passenger / day</span></article>
    <article><strong>28</strong><span>Daily flights</span></article>
    <article><strong>₹2L+</strong><span>Starting range</span></article>
  </div>
</body>
</html>
