<!-- @dsCard group="Type" viewport="700x170" name="Eyebrow & Mono Labels" subtitle="JetBrains Mono, uppercase, wide tracking, with leading hairline." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--ink); padding: 30px 28px; display: grid; gap: 20px; align-content: center; }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; color: var(--accent-deep); font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; }
  .eyebrow::before { content: ""; width: 26px; height: 1px; background: currentColor; }
  .labels { display: flex; gap: 10px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .labels span { border: 1px solid var(--rule); padding: 5px 10px; }
</style>
</head>
<body>
  <span class="eyebrow">Inventory · Portfolio</span>
  <span class="eyebrow" style="color:var(--brand-blue)">Why this format</span>
  <div class="labels">
    <span>PKG-01 · 18 UNITS</span>
    <span>FORMAT</span>
    <span>REQUEST MEDIA KIT</span>
    <span>v0.2 · DRAFT</span>
  </div>
</body>
</html>
