<!-- @dsCard group="Colors" viewport="700x150" name="Accent Line Divider" subtitle="The signature gradient hairline: transparent → red → blue → transparent." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--ink); padding: 34px 22px; display: grid; gap: 26px; align-content: center; }
  .rule { height: 1px; border: 0; background: var(--accent-line); }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
  <span class="lbl">--accent-line · maroon/blue route</span>
  <hr class="rule" />
  <hr class="rule" style="background: linear-gradient(90deg, transparent, #E21D2D 16%, #1597E5 84%, transparent);" />
  <span class="lbl" style="text-align:right">red/sky route</span>
</body>
</html>
