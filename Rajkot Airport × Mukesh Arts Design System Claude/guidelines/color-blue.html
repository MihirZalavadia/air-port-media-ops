<!-- @dsCard group="Colors" viewport="700x180" name="Brand Blue" subtitle="Structural color: deep blue (maroon route) + sky blue (red/sky route)." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--ink); }
  .wrap { display: flex; gap: 0; padding: 22px; }
  .sw { flex: 1; height: 124px; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; box-sizing: border-box; }
  .sw b { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; }
  .sw span { font-family: var(--font-mono); font-size: 10px; opacity: 0.7; margin-top: 3px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw" style="background:#1E2A78;color:#fff;"><b>Deep Blue</b><span>#1E2A78 · maroon route</span></div>
    <div class="sw" style="background:#27389A;color:#fff;"><b>Blue Lift</b><span>#27389A</span></div>
    <div class="sw" style="background:#0B74D1;color:#fff;"><b>Sky Deep</b><span>#0B74D1 · red/sky</span></div>
    <div class="sw" style="background:#1597E5;color:#fff;"><b>Sky</b><span>#1597E5 · red/sky</span></div>
  </div>
</body>
</html>
