<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing Scale" subtitle="8px base with editorial half-steps." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--ink); padding: 26px 28px; display: flex; align-items: flex-end; gap: 16px; }
  .step { text-align: center; }
  .bar { background: var(--accent); width: 100%; }
  .step b { display: block; font-family: var(--font-mono); font-size: 10px; margin-top: 8px; color: var(--ink); }
  .step span { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--muted); }
</style>
</head>
<body>
  <div class="step"><div class="bar" style="height:4px"></div><b>1</b><span>4</span></div>
  <div class="step"><div class="bar" style="height:8px"></div><b>2</b><span>8</span></div>
  <div class="step"><div class="bar" style="height:12px"></div><b>3</b><span>12</span></div>
  <div class="step"><div class="bar" style="height:16px"></div><b>4</b><span>16</span></div>
  <div class="step"><div class="bar" style="height:22px"></div><b>5</b><span>22</span></div>
  <div class="step"><div class="bar" style="height:28px"></div><b>6</b><span>28</span></div>
  <div class="step"><div class="bar" style="height:40px"></div><b>8</b><span>40</span></div>
  <div class="step"><div class="bar" style="height:56px"></div><b>10</b><span>56</span></div>
  <div class="step"><div class="bar" style="height:72px"></div><b>12</b><span>72</span></div>
</body>
</html>
