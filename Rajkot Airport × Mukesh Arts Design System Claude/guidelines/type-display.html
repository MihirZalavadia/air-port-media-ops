<!-- @dsCard group="Type" viewport="700x240" name="Display — Cormorant Garamond" subtitle="Serif display, weight 500. The emphasised word is italic + coloured." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--ink); padding: 30px 28px; }
  h1 { font-family: var(--font-display); font-weight: 500; font-size: 60px; line-height: 1.02; letter-spacing: -0.012em; margin: 0; }
  h1 em { font-style: italic; color: var(--accent); }
  small { display: block; margin-top: 18px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
  <h1>Airport visibility,<br /><em>engineered.</em></h1>
  <small>Cormorant Garamond · 500 · clamp(3rem → 6.2rem)</small>
</body>
</html>
