<!-- @dsCard group="Colors" viewport="700x180" name="Primary — Mukesh Arts Red" subtitle="The single hero accent. Rare and intentional." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--ink); }
  .wrap { display: flex; gap: 0; padding: 22px; }
  .sw { flex: 1; height: 124px; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; box-sizing: border-box; }
  .sw b { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; }
  .sw span { font-family: var(--font-mono); font-size: 10px; opacity: 0.7; margin-top: 3px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw" style="background:#E21D2D;color:#fff;"><b>Red</b><span>#E21D2D · --accent</span></div>
    <div class="sw" style="background:#A3162B;color:#fff;"><b>Red Deep</b><span>#A3162B · --accent-deep</span></div>
    <div class="sw" style="background:#7C0F23;color:#fff;"><b>Oxblood</b><span>#7C0F23 · night</span></div>
    <div class="sw" style="background:#FF4A58;color:#111;"><b>Red Lift</b><span>#FF4A58 · night accent</span></div>
  </div>
</body>
</html>
