<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); padding: 0; }
  .grid { display: grid; grid-template-columns: 1.6fr 1fr 1fr; height: 260px; }
  .ph { position: relative; background-size: cover; background-position: center; }
  .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(8,7,5,0.75)); }
  .cap { position: absolute; left: 14px; bottom: 12px; z-index: 2; color: #FFFAF0; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="grid">
    <div class="ph" style="background-image:url(../assets/img/hero-day.png)"><span class="cap">Terminal · golden hour</span></div>
    <div class="ph" style="background-image:url(../assets/img/pkg-01.png)"><span class="cap">Digital loop</span></div>
    <div class="ph" style="background-image:url(../assets/img/ad-3-night.png)"><span class="cap">Front-lit · night</span></div>
  </div>
</body>
</html>
