<!-- @dsCard group="Spacing" viewport="700x190" name="Corner Radii" subtitle="Sharp by default. Pills only on chips & toggles." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--ink); padding: 26px 28px; display: flex; gap: 22px; align-items: center; }
  .r { text-align: center; }
  .box { width: 92px; height: 72px; background: var(--surface); border: 1px solid var(--rule); }
  .r b { display: block; font-family: var(--font-mono); font-size: 10px; margin-top: 10px; }
  .r span { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--muted); }
  .pill { width: 110px; height: 38px; border-radius: 999px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="r"><div class="box" style="border-radius:0"></div><b>0px</b><span>cards · buttons · inputs</span></div>
  <div class="r"><div class="box" style="border-radius:4px"></div><b>4px</b><span>logo plate</span></div>
  <div class="r"><div class="box" style="border-radius:6px"></div><b>6px</b><span>brand mark</span></div>
  <div class="r"><div class="pill">Chip</div><b style="margin-top:18px">999px</b><span>chips · toggles</span></div>
</body>
</html>
