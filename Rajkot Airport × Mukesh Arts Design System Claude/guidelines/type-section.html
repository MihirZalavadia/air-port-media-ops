<!-- @dsCard group="Type" viewport="700x210" name="Section Heading" subtitle="H2 display with italic blue emphasis on light surfaces." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--ink); padding: 30px 28px; }
  h2 { font-family: var(--font-display); font-weight: 500; font-size: 40px; line-height: 1.05; letter-spacing: -0.01em; margin: 0; max-width: 18ch; }
  h2 em { font-style: italic; color: var(--brand-blue); }
  small { display: block; margin-top: 16px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
  <h2>Inventory presented like <em>a body of work</em>.</h2>
  <small>Cormorant Garamond · 500 · clamp(2.2rem → 3.6rem)</small>
</body>
</html>
