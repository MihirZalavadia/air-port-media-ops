<!-- @dsCard group="Spacing" viewport="700x210" name="Elevation & Hover" subtitle="Long, soft, low-opacity shadows. Hover lifts + reddens the border." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--ink); padding: 30px 28px; display: flex; gap: 26px; align-items: center; }
  .card { width: 150px; height: 96px; background: var(--surface); border: 1px solid var(--rule); display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .card.flat { box-shadow: none; }
  .card.lift { box-shadow: var(--card-shadow); }
  .card.hover { box-shadow: var(--hover-shadow); border-color: var(--accent); transform: translateY(-6px); }
</style>
</head>
<body>
  <div class="card flat">flat · rest</div>
  <div class="card lift">--card-shadow</div>
  <div class="card hover">--hover-shadow · hover</div>
</body>
</html>
