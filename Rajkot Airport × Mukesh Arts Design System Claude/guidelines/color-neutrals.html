<!-- @dsCard group="Colors" viewport="700x180" name="Neutrals" subtitle="Ink, grey, hairline rules, surfaces." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--ink); }
  .wrap { display: flex; gap: 0; padding: 22px; }
  .sw { flex: 1; height: 124px; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; box-sizing: border-box; border: 1px solid rgba(0,0,0,0.06); }
  .sw b { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; }
  .sw span { font-family: var(--font-mono); font-size: 10px; opacity: 0.7; margin-top: 3px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw" style="background:#111111;color:#fff;"><b>Ink</b><span>#111111 · --ink</span></div>
    <div class="sw" style="background:#2C3142;color:#fff;"><b>Ink 2</b><span>#2C3142</span></div>
    <div class="sw" style="background:#6B6B6B;color:#fff;"><b>Grey</b><span>#6B6B6B · --muted</span></div>
    <div class="sw" style="background:#C8D0E6;color:#111;"><b>Rule</b><span>#C8D0E6</span></div>
    <div class="sw" style="background:#F5F6FA;color:#111;"><b>BG</b><span>#F5F6FA</span></div>
  </div>
</body>
</html>
