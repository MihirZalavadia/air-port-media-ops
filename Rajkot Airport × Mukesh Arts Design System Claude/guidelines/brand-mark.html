<!-- @dsCard group="Brand" viewport="700x200" name="Brand Mark" subtitle="Mukesh Arts mark — dark wordmark on light, light wordmark on dark." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); display: grid; grid-template-columns: 1fr 1fr; }
  .panel { padding: 30px; display: flex; align-items: center; gap: 18px; }
  .light { background: #FFFFFF; }
  .dark { background: #12141E; }
  .plate { width: 110px; height: 72px; border-radius: 6px; display: grid; place-items: center; background: #fff; box-shadow: 0 12px 28px -16px rgba(17,17,17,0.3); border: 1px solid rgba(30,42,120,0.12); }
  .dark .plate { background: #1B1E2D; border-color: rgba(255,255,255,0.08); }
  .plate img { width: 80%; }
  .meta b { font-family: var(--font-display); font-size: 17px; font-weight: 500; color: var(--ink); }
  .dark .meta b { color: #F4F6FF; }
  .meta small { display: block; margin-top: 4px; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
  <div class="panel light">
    <span class="plate"><img src="../assets/logo/mukesh-arts-mark.svg" alt="Mukesh Arts" /></span>
    <span class="meta"><b>On light</b><small>mark.svg</small></span>
  </div>
  <div class="panel dark">
    <span class="plate"><img src="../assets/logo/mukesh-arts-mark-light.svg" alt="Mukesh Arts" /></span>
    <span class="meta"><b style="color:#F4F6FF">On dark</b><small>mark-light.svg</small></span>
  </div>
</body>
</html>
